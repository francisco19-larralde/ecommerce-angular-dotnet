<div class="flex bg-base-200/30">

  <!-- SIDEBAR -->
  <aside class="w-64 shrink-0 bg-base-100 border-r border-base-200 flex flex-col">

    <div class="p-5 border-b border-base-200">
      <p class="font-black text-lg text-base-content">Panel Admin</p>
      <p class="text-xs text-base-content/50 mt-0.5">{{ authService.usuario()?.nombre }}</p>
    </div>

    <nav class="flex-1 p-3">
      <ul class="flex flex-col gap-1">
        @for (item of navegacion; track item.path) {
        <li>
          <a [routerLink]="item.path" routerLinkActive="bg-primary/10 text-primary font-semibold" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-base-content/70
          hover:bg-base-200/60 transition-colors duration-150">
            @switch (item.icono) {
            @case ('box') {
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
              stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="m21 7.5-9-5.25L3 7.5m18 0-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9" />
            </svg>
            }
            @case ('tag') {
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
              stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M9.568 3H5.25A2.25 2.25 0 0 0 3 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 0 0 5.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 0 0 9.568 3Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 6h.008v.008H6V6Z" />
            </svg>
            }
            @case ('chart') {
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
              stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" />
            </svg>
            }
            }
            {{ item.label }}
          </a>
        </li>
        }
      </ul>
    </nav>

    <div class="p-3 border-t border-base-200">
      <a routerLink="/home"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-base-content/60 hover:bg-base-200/60 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"
          class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
        </svg>
        Volver a la tienda
      </a>
    </div>
  </aside>

  <!-- CONTENIDO DE LA SECCIÓN ACTIVA -->
  <main class="flex-1 min-w-0">
    <router-outlet></router-outlet>
  </main>

</div>
